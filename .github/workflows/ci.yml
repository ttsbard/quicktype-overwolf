name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Validate Manifest & Scripts
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax
        run: |
          node --check quicktype-overlay/config.js
          node --check quicktype-overlay/window-geometry.js
          node --check quicktype-overlay/desktop.js
          node --check quicktype-overlay/overlay.js
          node --check scripts/patch-overwolf-gamelist.js
          Write-Host "All JavaScript files passed syntax verification."

      - name: Validate Overwolf Manifest
        run: |
          $manifestPath = "quicktype-overlay/manifest.json"
          if (-not (Test-Path $manifestPath)) { throw "Missing manifest.json" }
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ($manifest.manifest_version -ne 1) { throw "Invalid manifest_version: $($manifest.manifest_version)" }
          if ($manifest.type -ne "WebApp") { throw "Invalid type: $($manifest.type)" }
          if (-not $manifest.meta.name) { throw "Missing meta.name" }
          if (-not $manifest.meta.version) { throw "Missing meta.version" }
          
          # Check icon file
          if (-not (Test-Path "quicktype-overlay/$($manifest.meta.icon)")) {
              throw "Declared icon does not exist: $($manifest.meta.icon)"
          }
          
          # Check all declared window files
          foreach ($win in $manifest.data.windows.PSObject.Properties) {
              $winFile = "quicktype-overlay/$($win.Value.file)"
              if (-not (Test-Path $winFile)) {
                  throw "Declared window file does not exist: $winFile"
              }
          }
          Write-Host "Manifest schema and referenced files verified for version $($manifest.meta.version)."

      - name: Run Regression Tests
        run: node --test tests/regressions.test.cjs

      - name: Validate PowerShell Scripts
        run: |
          $scripts = Get-ChildItem -Path scripts -Filter "*.ps1"
          foreach ($s in $scripts) {
              $errors = $null
              $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  throw "Syntax error in $($s.Name): $($errors[0].Message)"
              }
          }
          Write-Host "All PowerShell scripts passed AST validation."

  build-package:
    name: Build ZIP & OPK
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Verify ZIP and OPK
        run: |
          .\scripts\package-app.ps1

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickType-Release-ZIP-OPK
          path: |
            dist/*.zip
            dist/*.opk
          if-no-files-found: error
          retention-days: 14
