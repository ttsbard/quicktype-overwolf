<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>QuickType Background Controller</title>
</head>
<body>
<script src="config.js"></script>
<script>
  var HOTKEY_NAME = 'toggle_input_form';
  var OVERLAY_WINDOW = 'overlay';
  var DESKTOP_WINDOW = 'desktop';

  var switching = false;
  var currentConfig = loadOverlayConfig();

  console.log('[QuickType] Controller initialized');

  if (typeof overwolf !== 'undefined') {
    // 1. Обработка клика по иконке в доке Overwolf или запуска приложения
    overwolf.extensions.onAppLaunchTriggered.addListener(function (event) {
      console.log('[QuickType] onAppLaunchTriggered:', event);
      showOverlay();
    });

    // При запуске сразу открываем поле ввода; настройки доступны из него.
    showOverlay();

    // 2. Хоткей вызова внутриигрового оверлея
    overwolf.settings.hotkeys.onPressed.addListener(function (event) {
      if (event.name !== HOTKEY_NAME) return;
      if (switching) return;
      switching = true;
      setTimeout(function () { switching = false; }, 1200);

      overwolf.windows.getWindowState(OVERLAY_WINDOW, function (result) {
        if (!result.success) {
          switching = false;
          console.error('[QuickType] getWindowState error:', result.error);
          return;
        }

        var isOpen = result.window_state_ex === 'normal' || result.window_state_ex === 'maximized';
        if (isOpen) {
          hideOverlay();
        } else {
          showOverlay();
        }
      });
    });

    // 3. Обработка сообщений между окнами
    overwolf.windows.onMessageReceived.addListener(function (message) {
      if (message.id === 'open_settings') {
        openDesktopWindow();
      } else if (message.id === 'hide_overlay') {
        switching = true;
        hideOverlay();
      } else if (message.id === 'config_updated') {
        currentConfig = loadOverlayConfig();
        applyConfigToOverlay();
      } else if (message.id === 'preview_config') {
        withOverlayWindow(function (id) {
          overwolf.windows.sendMessage(id, 'preview_config', message.content, function () {});
        });
      } else if (message.id === 'reset_bounds') {
        withOverlayWindow(function (id) {
          overwolf.windows.sendMessage(id, 'reset_bounds', {}, function () {});
        });
      } else if (message.id === 'submit_text') {
        handleSubmitText(message.content || {});
      }
    });
  }

  function openDesktopWindow() {
    overwolf.windows.obtainDeclaredWindow(DESKTOP_WINDOW, function (res) {
      if (res.success) {
        overwolf.windows.restore(res.window.id, function () {
          overwolf.windows.bringToFront(res.window.id, true, function () {});
        });
      }
    });
  }

  function withOverlayWindow(callback) {
    overwolf.windows.obtainDeclaredWindow(OVERLAY_WINDOW, function (result) {
      if (!result.success) {
        switching = false;
        console.error('[QuickType] obtainDeclaredWindow error:', result.error);
        return;
      }
      callback(result.window.id);
    });
  }

  function applyConfigToOverlay() {
    withOverlayWindow(function (id) {
      overwolf.windows.sendMessage(id, 'config_updated', currentConfig, function () {});
    });
  }

  function focusInputField(id) {
    overwolf.windows.sendMessage(id, 'focus_input_field', {}, function () {});
  }

  function showOverlay() {
    withOverlayWindow(function (id) {
      // Восстанавливаем окно
      overwolf.windows.restore(id, function (restoreResult) {
        if (!restoreResult.success) {
          switching = false;
          console.error('[QuickType] restore error:', restoreResult.error);
          return;
        }

        var focusTriggered = false;
        function triggerOverlayFocus() {
          if (focusTriggered) return;
          focusTriggered = true;

          if (typeof overwolf.windows.requestOverlayFocus === 'function') {
            overwolf.windows.requestOverlayFocus(id, function (focusResult) {
              switching = false;
              focusInputField(id);
            });
          } else {
            switching = false;
            focusInputField(id);
          }
        }

        // Переводим окно на передний план с захватом системного фокуса
        if (typeof overwolf.windows.bringToFront === 'function') {
          overwolf.windows.bringToFront(id, true, function () {
            triggerOverlayFocus();
          });
          // Страховочный вызов фокуса на случай задержки колбэка от Overwolf
          setTimeout(triggerOverlayFocus, 60);
        } else {
          triggerOverlayFocus();
        }
      });
    });
  }

  function hideOverlay() {
    withOverlayWindow(function (id) {
      overwolf.windows.sendMessage(id, 'overlay_hidden', {}, function () {});
      overwolf.windows.minimize(id, function (result) {
        switching = false;
      });
    });
  }

  // Асинхронное выполнение REST API запроса
  function handleSubmitText(submission) {
    var text = submission.text;
    if (!text || !submission.requestId) return;
    currentConfig = loadOverlayConfig();

    executeRestRequest(currentConfig, text)
      .then(function (result) {
        if (!result.ok) {
          throw new Error(result.error || ('HTTP ' + result.status));
        }
        console.log('[QuickType] REST запрос выполнен успешно:', result.status, result.durationMs + 'ms');
        withOverlayWindow(function (id) {
          overwolf.windows.sendMessage(id, 'rest_result', { ok: true, status: result.status, requestId: submission.requestId }, function () {});
        });
      })
      .catch(function (error) {
        console.error('[QuickType] Ошибка REST запроса:', error.message);
        withOverlayWindow(function (id) {
          overwolf.windows.sendMessage(id, 'rest_result', { ok: false, error: error.message, requestId: submission.requestId }, function () {});
        });
      });
  }
</script>
</body>
</html>
