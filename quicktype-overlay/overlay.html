<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuickType</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div class="hud-container" id="hudContainer">
    <!-- Грани и углы изменения размера окна (resize handles) -->
    <div class="hud-resize-edge hud-resize-top" id="hudResizeTop" data-edge="Top"></div>
    <div class="hud-resize-edge hud-resize-bottom" id="hudResizeBottom" data-edge="Bottom"></div>
    <div class="hud-resize-edge hud-resize-left" id="hudResizeLeft" data-edge="Left"></div>
    <div class="hud-resize-edge hud-resize-right" id="hudResizeRight" data-edge="Right"></div>
    <div class="hud-resize-corner hud-resize-top-left" id="hudResizeTopLeft" data-edge="TopLeft"></div>
    <div class="hud-resize-corner hud-resize-top-right" id="hudResizeTopRight" data-edge="TopRight"></div>
    <div class="hud-resize-corner hud-resize-bottom-left" id="hudResizeBottomLeft" data-edge="BottomLeft"></div>
    <div class="hud-resize-corner hud-resize-bottom-right hud-resize-grip" id="hudResizeGrip" data-edge="BottomRight" title="Drag to resize"></div>

    <div class="hud-header">
      <div class="hud-drag-strip" id="hudDrag"></div>
      <div class="hud-header-actions">
        <button type="button" id="btn-open-settings" class="hud-icon-button" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><g transform="translate(0 .4)"><path d="m6.5 1-.4 1.7-1.4.8L3 3l-1.5 2.6 1.3 1.2v1.6l-1.3 1.2L3 12.2l1.7-.5 1.4.8.4 1.7h3l.4-1.7 1.4-.8 1.7.5 1.5-2.6-1.3-1.2V6.8l1.3-1.2L13 3l-1.7.5-1.4-.8L9.5 1Z"/><circle cx="8" cy="7.6" r="2.2"/></g></svg>
        </button>
        <button type="button" id="btn-close-overlay" class="hud-icon-button" title="Close" aria-label="Close input window">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="m3 3 10 10m0-10-10 10"/></svg>
        </button>
      </div>
    </div>

    <div class="input-wrapper">
      <textarea 
        id="inputText" 
        class="hud-input" 
        autocomplete="off" 
        spellcheck="false" 
        autofocus
      ></textarea>
    </div>

    <!-- Сообщение об ошибке при отправке -->
    <div class="hud-status-banner" id="hudStatusBanner" style="display: none;">
      <span id="hudStatusText" role="status" aria-live="polite"></span>
      <button type="button" id="btn-close-error" class="hud-icon-button hud-error-close" title="Dismiss error" aria-label="Dismiss error" hidden>
        <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg>
      </button>
    </div>

    <!-- Подсказки по клавишам (скрываемые через настройки) -->
    <div class="hud-footer" id="hudFooter">
      <span class="shortcut-hint"><kbd>Enter</kbd> <span>— Send</span></span>
      <span class="hint-sep">·</span>
      <span class="shortcut-hint"><kbd>Esc</kbd> <span>— Close</span></span>
      <span class="hint-sep hint-secondary">·</span>
      <span class="shortcut-hint hint-secondary"><kbd>Shift+Enter</kbd> <span>— New line</span></span>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
